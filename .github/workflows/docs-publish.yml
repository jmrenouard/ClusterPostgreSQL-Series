name: Publish Documentation (MkDocs Material)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy built documentation to IONOS"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: docs-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-and-build:
    name: Verify and Build MkDocs Material Site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-docs.txt"

      - name: Install MkDocs Material and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt matplotlib

      - name: Run full unit and documentation test suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Build and verify MkDocs Material site
        run: python scripts/build_mkdocs.py --out site --strict --check

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site/
          include-hidden-files: true
          retention-days: 7

  deploy-ionos:
    name: Deploy Documentation to IONOS
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)

    steps:
      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: mkdocs-site
          path: .

      - name: Verify .htaccess and entrypoints before SFTP upload
        run: |
          test -f .htaccess
          test -f index.html
          test -f dashboard/index.html

      - name: Upload built documentation site via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.IONOS_FTP_SERVER }}
          username: ${{ secrets.IONOS_FTP_USERNAME }}
          password: ${{ secrets.IONOS_FTP_PASSWORD }}
          sftp_only: true
          port: ${{ secrets.IONOS_FTP_PORT || '22' }}
          local_path: ./
          remote_path: ${{ secrets.IONOS_REMOTE_PATH }}/
          sftpArgs: '-o ConnectTimeout=10'

      - name: Explicitly upload .htaccess via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.IONOS_FTP_SERVER }}
          username: ${{ secrets.IONOS_FTP_USERNAME }}
          password: ${{ secrets.IONOS_FTP_PASSWORD }}
          sftp_only: true
          port: ${{ secrets.IONOS_FTP_PORT || '22' }}
          local_path: .htaccess
          remote_path: ${{ secrets.IONOS_REMOTE_PATH }}/
          sftpArgs: '-o ConnectTimeout=10'

      - name: Run live HTTPS smoke checks on postgresql-cluster.lightpath.fr
        run: |
          curl -fsSLI https://postgresql-cluster.lightpath.fr/
          curl -fsSLI https://postgresql-cluster.lightpath.fr/dashboard/index.html
          curl -fsSLI https://postgresql-cluster.lightpath.fr/overview-en/
          curl -fsSLI https://postgresql-cluster.lightpath.fr/overview-fr/
          curl -fsSLI https://postgresql-cluster.lightpath.fr/assets/charts/chart_01_tps_log_all_suites.png
