site_name: ClusterPostgreSQL-Series
site_description: Benchmarks, PoCs Docker et etude PostgreSQL Multi-Maitres et Actif-Actif
site_url: https://postgresql-cluster.lightpath.fr/fr/
repo_name: jmrenouard/ClusterPostgreSQL-Series
repo_url: https://github.com/jmrenouard/ClusterPostgreSQL-Series
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Jean-Marie Renouard &middot; LightPath
docs_dir: docs
exclude_docs: |
  en/
  *_en.md
  overview-en.md
  /01-tutorials/
  /02-how-to-guides/
  /03-reference/
  /04-explanation/
  fr/index.md
hooks:
  - scripts/mkdocs_hooks.py
theme:
  name: material
  language: fr
  logo: assets/clusterpostgresql-series-icon.png
  favicon: assets/clusterpostgresql-series-icon.png
  features: [navigation.tabs, navigation.tabs.sticky, navigation.sections, navigation.indexes, navigation.top, navigation.tracking, navigation.footer, search.suggest, search.highlight, search.share, content.code.copy, content.tabs.link]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle: {icon: material/brightness-7, name: Passer au mode sombre}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle: {icon: material/brightness-4, name: Passer au mode clair}
plugins:
  - search: {lang: fr}
extra:
  alternate: [{name: English, link: /, lang: en}, {name: Francais, link: /fr/, lang: fr}]
  social:
    - {icon: fontawesome/brands/github, link: "https://github.com/jmrenouard/ClusterPostgreSQL-Series", name: GitHub}
    - {icon: fontawesome/solid/globe, link: "https://www.lightpath.fr", name: LightPath}
extra_css: [https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css, stylesheets/extra.css]
extra_javascript: [javascripts/katex.js, https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js, https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js]
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true, line_spans: __span, pygments_lang_class: true}
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
nav:
  - Accueil: index.md
  - Vues d'ensemble:
    - Apercu FR: overview-fr.md
    - Piles Compose: stacks-overview.md
    - Explorateur: dashboard/index.html
  - Tutoriels:
    - Apercu Tutoriels: fr/01-tutoriels/index.md
    - "01 Premier Lab PoC Docker": fr/01-tutoriels/01-premier-lab-poc-docker.md
    - "02 Lab pgbench & sysbench": fr/01-tutoriels/02-lab-benchmarks-pgbench-sysbench.md
  - Guides pratiques:
    - Apercu Guides pratiques: fr/02-guides-pratiques/index.md
    - "01 Executer les benchmarks": fr/02-guides-pratiques/01-executer-benchmarks-topologies.md
    - "02 Verifier limites & hygiene": fr/02-guides-pratiques/02-verifier-limites-et-hygiene.md
  - Reference:
    - Apercu Reference: fr/03-reference/index.md
    - Chapitres:
      - "04 Etude (40 Criteres)": fr/04_etude_comparative_fonctionnalites.md
      - "05 PoC & Protocole": fr/05_architectures_poc_et_protocole_de_test.md
      - "06 Benchmarks (A-H)": fr/06_resultats_tests_et_benchmarks.md
      - "07 Choix & Architecture": fr/07_guide_de_choix_et_architecture_cible.md
      - "08 Limites": fr/08_limites_et_modes_de_defaillance.md
      - "09 Graphiques": fr/09_methodologie_benchmarks_et_graphiques.md
      - "11 Popularite": fr/11_popularite_et_vitalite_ecosysteme.md
      - "13 Tuning (SCALE=20)": fr/13_optimisation_production_et_benchmarks_realistes.md
      - "14 TDE": fr/14_chiffrement_transparent_tde.md
    - Solutions:
      - "#1 PG 17 Bidir": fr/solutions/pg17_bidirectional_logical.md
      - "#2 pgEdge / Spock": fr/solutions/pgedge_spock.md
      - "#3 pglogical 2": fr/solutions/pglogical2.md
      - "#4 EDB PGD": fr/solutions/edb_pgd.md
      - "#5 YugabyteDB": fr/solutions/yugabytedb.md
      - "#6 CockroachDB": fr/solutions/cockroachdb.md
      - "#7 Citus": fr/solutions/citus.md
      - "#8 OpenTenBase": fr/solutions/opentenbase_pgxl.md
      - "#9 Bucardo 5": fr/solutions/bucardo.md
      - "#10 SymmetricDS": fr/solutions/symmetricds.md
      - "#11 PgPool-II": fr/solutions/pgpool_ii.md
      - "#12 Aurora Limitless": fr/solutions/aws_aurora_limitless.md
      - "#13 Spanner & AlloyDB": fr/solutions/gcp_spanner_alloydb.md
      - "#14 Triggers": fr/solutions/legacy_triggers.md
      - "#15a Standalone": fr/solutions/pg17_standalone.md
      - "#15b Patroni": fr/solutions/pg17_physical_streaming_patroni.md
      - "#16 Logique Unidir": fr/solutions/pg17_logical_unidirectional.md
      - "#17 PG 18.6": fr/solutions/pg18_native_clustering.md
      - "#18 YT Cluster": fr/solutions/yt_cluster_lite.md
    - Gouvernance:
      - Journal: ACTION_LOGBOOK.md
      - Registre RCA: RCA_REGISTER.md
  - Explications:
    - Apercu Explications: fr/04-explications/index.md
    - "01 Synthese": fr/01_synthese_et_taxonomie.md
    - "02 CAP & Conflits": fr/02_fondements_theoriques_cap_pacelc_conflits.md
    - "03a Extensions": fr/03a_catalogue_natif_et_extensions.md
    - "03b Distribue & Cloud": fr/03b_catalogue_distribue_triggers_cloud.md
    - "10 Streaming vs MM": fr/10_comparatif_streaming_logique_multimaster.md
    - "12 PG 18.6": fr/12_clustering_postgresql_18_et_benchmarks.md
