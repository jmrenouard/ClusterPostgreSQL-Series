site_name: ClusterPostgreSQL-Series
site_description: Comparative study, reproducible Docker PoCs, and empirical benchmarks for PostgreSQL Multi-Master and Active-Active architectures
site_url: https://postgresql-cluster.lightpath.fr/
repo_name: jmrenouard/ClusterPostgreSQL-Series
repo_url: https://github.com/jmrenouard/ClusterPostgreSQL-Series
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Jean-Marie Renouard &middot; LightPath

docs_dir: docs

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: en
  logo: assets/clusterpostgresql-series-icon.png
  favicon: assets/clusterpostgresql-series-icon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jmrenouard/ClusterPostgreSQL-Series
      name: ClusterPostgreSQL-Series on GitHub
    - icon: fontawesome/solid/globe
      link: https://www.lightpath.fr
      name: LightPath

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Overviews:
      - Overview (English): overview-en.md
      - Apercu (Francais): overview-fr.md
      - 13 Compose Stacks: stacks-overview.md
      - Interactive Explorer: dashboard/index.html
  - Tutorials:
      - "EN - 05 PoC Architectures & Test Protocol": en/05_poc_architectures_and_test_protocol.md
      - "FR - 05 Architectures PoC & Protocole": fr/05_architectures_poc_et_protocole_de_test.md
  - How-To Guides:
