site_name: ClusterPostgreSQL-Series
site_description: Comparative study, reproducible Docker PoCs, and empirical benchmarks for PostgreSQL Multi-Master and Active-Active architectures
site_url: https://postgresql-cluster.lightpath.fr/
repo_name: jmrenouard/ClusterPostgreSQL-Series
repo_url: https://github.com/jmrenouard/ClusterPostgreSQL-Series
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Jean-Marie Renouard &middot; LightPath

docs_dir: docs
exclude_docs: |
  fr/
  *_fr.md
  overview-fr.md
  /01-tutoriels/
  /02-guides-pratiques/
  /03-reference-fr/
  /04-explications/
  en/index.md

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: en
  logo: assets/clusterpostgresql-series-icon.png
  favicon: assets/clusterpostgresql-series-icon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: Francais
      link: /fr/
      lang: fr
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jmrenouard/ClusterPostgreSQL-Series
      name: ClusterPostgreSQL-Series on GitHub
    - icon: fontawesome/solid/globe
      link: https://www.lightpath.fr
      name: LightPath

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Overviews:
      - Overview (English): overview-en.md
      - 13 Compose Stacks: stacks-overview.md
      - Interactive Explorer: dashboard/index.html
  - Tutorials:
      - Tutorials Overview: en/01-tutorials/index.md
      - "01 First Docker PoC Lab": en/01-tutorials/01-first-docker-poc-lab.md
      - "02 pgbench & sysbench Lab": en/01-tutorials/02-pgbench-sysbench-lab.md
  - How-To Guides:
      - How-To Guides Overview: en/02-how-to-guides/index.md
      - "01 Run Topology Benchmarks": en/02-how-to-guides/01-run-topology-benchmarks.md
      - "02 Verify Limits & Hygiene": en/02-how-to-guides/02-verify-limits-and-hygiene.md
  - Reference:
      - Reference Overview: en/03-reference/index.md
      - Chapters & Matrices:
          - "04 Feature Comparison (40 Criteria)": en/04_comprehensive_feature_comparison.md
          - "05 PoC Architectures & Test Protocol": en/05_poc_architectures_and_test_protocol.md
          - "06 Empirical Benchmarks (A-H)": en/06_empirical_test_and_benchmark_results.md
          - "07 Decision Framework & Guide": en/07_decision_framework_and_production_guide.md
          - "08 Limits & Failure Modes": en/08_limits_and_failure_modes.md
          - "09 Methodology & 13 Charts": en/09_benchmarks_methodology_and_charts.md
          - "11 Ecosystem Popularity & Vitality": en/11_ecosystem_popularity_and_vitality.md
          - "13 Production Tuning (PG_SCALE=20)": en/13_production_tuning_and_realistic_benchmarks.md
          - "14 Transparent Data Encryption (TDE)": en/14_transparent_data_encryption_tde.md
      - Solutions:
          - "#1 PG 17 Bidirectional Logical": en/solutions/pg17_bidirectional_logical.md
          - "#2 pgEdge / Spock v5": en/solutions/pgedge_spock.md
          - "#3 pglogical 2": en/solutions/pglogical2.md
          - "#4 EDB Postgres Distributed": en/solutions/edb_pgd.md
          - "#5 YugabyteDB": en/solutions/yugabytedb.md
          - "#6 CockroachDB": en/solutions/cockroachdb.md
          - "#7 Citus": en/solutions/citus.md
          - "#8 OpenTenBase / PG-XL": en/solutions/opentenbase_pgxl.md
          - "#9 Bucardo 5": en/solutions/bucardo.md
          - "#10 SymmetricDS": en/solutions/symmetricds.md
          - "#11 PgPool-II": en/solutions/pgpool_ii.md
          - "#12 AWS Aurora Limitless": en/solutions/aws_aurora_limitless.md
          - "#13 GCP Spanner & AlloyDB": en/solutions/gcp_spanner_alloydb.md
          - "#14 Legacy Triggers (EOL)": en/solutions/legacy_triggers.md
          - "#15a PG 17 Standalone": en/solutions/pg17_standalone.md
          - "#15b PG 17 Physical Streaming & Patroni": en/solutions/pg17_physical_streaming_patroni.md
          - "#16 PG 17 Uni-Directional Logical": en/solutions/pg17_logical_unidirectional.md
          - "#17 PG 18.6 Native Clustering": en/solutions/pg18_native_clustering.md
          - "#18 YT Cluster & YT Cluster Lite": en/solutions/yt_cluster_lite.md
      - Governance Registers:
          - Action Logbook: ACTION_LOGBOOK.md
          - RCA & Assumptions Register: RCA_REGISTER.md
  - Explanation:
      - Explanation Overview: en/04-explanation/index.md
      - "01 Executive Summary & Taxonomy": en/01_executive_summary_and_taxonomy.md
      - "02 CAP, PACELC & Conflict Calculus": en/02_theoretical_foundations_cap_pacelc_conflicts.md
      - "03a Native & Extensions Catalog": en/03a_solutions_native_and_extensions.md
      - "03b Distributed, Triggers & Cloud": en/03b_solutions_distributed_triggers_cloud.md
      - "10 Streaming vs Logical vs Multi-Master": en/10_streaming_vs_logical_vs_multimaster.md
      - "12 PG 18.6 Clustering": en/12_postgresql_18_clustering_and_benchmarks.md
